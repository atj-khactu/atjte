[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atjte"
version = "0.2.4"
description = "ATJ trading engines: cross-venue arbitrage market making between crypto exchanges (CCXT) and CFD platforms (MetaTrader 5)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ATJ Traders" }]
keywords = ["trading", "arbitrage", "market-making", "ccxt", "kraken", "metatrader5", "fix", "ibkr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    # 4.5.74: the first with Lighter createOrderWs/cancelOrderWs (venues.py ws_orders)
    "ccxt>=4.5.74,<5",
    # the FIX 4.4 codec (atjte.fix, the Kraken FIX gateway)
    "simplefix>=1.0.17",
    # the IANA time zones zoneinfo reads (trading blackouts); Windows ships none
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
# The MetaTrader 5 terminal API — Windows only, needed for the MT5 hedge leg.
mt5 = ["MetaTrader5>=5.0.5735; platform_system == 'Windows'"]
# The cTrader gateway (atjte.gateways.ctrader): it speaks the Open API wire
# itself over the vendored Spotware messages, so only protobuf. (The older
# direct connector atjte.clients.ctrader still needs ctrader-open-api, whose
# pins never resolve here: pip install ctrader-open-api --no-deps.)
ctrader = ["protobuf>=4.21"]
# Interactive Brokers through TWS / IB Gateway (the IBKR gateway).
ibkr = ["ib_async>=2.0"]
# Databento market data (the Databento gateway: historical + live bars).
databento = ["databento>=0.87"]

[project.scripts]
atjte = "atjte.cli:main"
atjte-gateway = "atjte.gateways.fix.gateway:main"

[project.urls]
Homepage = "https://github.com/atj-khactu/atjte"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Templates and engine defaults are read as FILES (by an AST literal reader,
# never imported) — by the control panel, the generator and the tests — so
# they ship as package data as well as modules.
atjte = [
    "py.typed",
    "engines/*/base_settings.py",
    "engines/*/project_settings_template.py",
    "strategy_types/*/*/*.py",
    # what `atjte-gateway --new` copies (gateway.json, gateway.env.example, launchers)
    "gateways/templates/*/*",
    # the MIT notice of the vendored cTrader Open API messages
    "gateways/ctrader/messages/LICENSE.spotware",
    # samples the control panel imports: event calendars, strategy settings
    "samples/*/*.csv",
    "samples/*/*.json",
]
